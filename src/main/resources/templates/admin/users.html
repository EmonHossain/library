<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Users')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="mx-auto max-w-6xl px-4 py-8">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="mt-6 text-3xl font-semibold tracking-tight">Users</h1>
    <div class="mt-6 grid gap-4">
        <form th:each="user : ${users}" th:action="@{/admin/users/{id}(id=${user.id})}" method="post" class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="flex flex-col justify-between gap-4 md:flex-row md:items-center">
                <div>
                    <h2 th:text="${user.fullName}" class="text-lg font-semibold">Name</h2>
                    <p th:text="${user.email}" class="text-sm text-slate-600">Email</p>
                </div>
                <div class="flex flex-wrap items-center gap-4">
                    <label class="flex items-center gap-2 text-sm font-medium text-slate-700">
                        <input type="checkbox" name="enabled" value="true" th:checked="${user.enabled}" class="h-4 w-4 rounded border-slate-300">
                        Enabled
                    </label>
                    <label th:each="role : ${roles}" class="flex items-center gap-2 text-sm font-medium text-slate-700">
                        <input type="checkbox" name="roles" th:value="${role.name}" th:checked="${user.roles.![name].contains(role.name)}" class="h-4 w-4 rounded border-slate-300">
                        <span th:text="${role.name}">ROLE</span>
                    </label>
                    <button type="submit" class="rounded-md bg-slate-950 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">Save</button>
                </div>
            </div>
        </form>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="mx-auto max-w-3xl px-4 py-8">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="mt-6 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
        <h1 th:text="${mode == 'create' ? 'Add book' : 'Edit book'}" class="text-3xl font-semibold tracking-tight">Book</h1>
        <form id="book-upload-form" th:action="${mode == 'create'} ? @{/admin/books} : @{/admin/books/{id}(id=${bookId})}" th:data-success-url="@{/admin/books}" th:object="${bookForm}" method="post" enctype="multipart/form-data" class="mt-6 grid gap-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Title</span>
                <input th:field="*{title}" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
                <span th:errors="*{title}" class="mt-1 block text-sm text-red-700"></span>
            </label>
            <div class="grid gap-4 md:grid-cols-2">
                <label class="block">
                    <span class="text-sm font-medium text-slate-700">Author</span>
                    <input th:field="*{author}" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
                    <span th:errors="*{author}" class="mt-1 block text-sm text-red-700"></span>
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-700">ISBN</span>
                    <input th:field="*{isbn}" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
                    <span th:errors="*{isbn}" class="mt-1 block text-sm text-red-700"></span>
                </label>
            </div>
            <div class="grid gap-4 md:grid-cols-2">
                <label class="block">
                    <span class="text-sm font-medium text-slate-700">Category</span>
                    <select th:field="*{categoryId}" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
                        <option value="">Select category</option>
                        <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                    </select>
                    <span th:errors="*{categoryId}" class="mt-1 block text-sm text-red-700"></span>
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-700">Total copies</span>
                    <input th:field="*{totalCopies}" type="number" min="0" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
                    <span th:errors="*{totalCopies}" class="mt-1 block text-sm text-red-700"></span>
                </label>
            </div>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Description</span>
                <textarea th:field="*{description}" rows="4" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900"></textarea>
                <span th:errors="*{description}" class="mt-1 block text-sm text-red-700"></span>
            </label>
            <div class="grid gap-4 md:grid-cols-2">
                <label class="block">
                    <span class="text-sm font-medium text-slate-700">Book PDF</span>
                    <input th:field="*{pdfFile}" type="file" accept="application/pdf,.pdf" th:required="${mode == 'create'}" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none file:mr-3 file:rounded-md file:border-0 file:bg-slate-950 file:px-3 file:py-2 file:text-sm file:font-medium file:text-white focus:border-slate-900">
                    <span th:if="${mode == 'edit' and book.pdfFile != null}" class="mt-2 block text-sm text-slate-600">Current: <a th:href="@{/files/{id}(id=${book.pdfFile.id})}" th:text="${book.pdfFile.originalFilename}" target="_blank" class="font-medium text-slate-950 underline"></a></span>
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-700">Cover image</span>
                    <input th:field="*{coverImageFile}" type="file" accept="image/*" th:required="${mode == 'create'}" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none file:mr-3 file:rounded-md file:border-0 file:bg-slate-950 file:px-3 file:py-2 file:text-sm file:font-medium file:text-white focus:border-slate-900">
                    <span th:if="${mode == 'edit' and book.coverImageFile != null}" class="mt-2 block text-sm text-slate-600">Current: <a th:href="@{/files/{id}(id=${book.coverImageFile.id})}" th:text="${book.coverImageFile.originalFilename}" target="_blank" class="font-medium text-slate-950 underline"></a></span>
                </label>
            </div>
            <div id="upload-progress" class="hidden rounded-md border border-slate-200 bg-slate-50 p-4">
                <div class="flex items-center justify-between gap-3 text-sm font-medium text-slate-700">
                    <span id="upload-status">Preparing upload</span>
                    <span id="upload-percent">0%</span>
                </div>
                <div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-200">
                    <div id="upload-bar" class="h-full w-0 rounded-full bg-slate-950 transition-[width] duration-150"></div>
                </div>
                <div class="mt-3 grid gap-2 text-xs text-slate-600 sm:grid-cols-3">
                    <span>Uploaded <strong id="upload-size" class="font-semibold text-slate-900">0 B</strong></span>
                    <span>Speed <strong id="upload-speed" class="font-semibold text-slate-900">0 B/s</strong></span>
                    <span>ETA <strong id="upload-eta" class="font-semibold text-slate-900">calculating</strong></span>
                </div>
            </div>
            <div class="flex gap-3">
                <button id="book-save-button" type="submit" class="rounded-md bg-slate-950 px-4 py-2 font-medium text-white hover:bg-slate-800 disabled:cursor-not-allowed disabled:bg-slate-300">Save</button>
                <a th:href="@{/admin/books}" class="rounded-md border border-slate-300 px-4 py-2 font-medium text-slate-800 hover:bg-slate-50">Cancel</a>
            </div>
        </form>
    </section>
</main>
<script>
    (() => {
        const form = document.getElementById('book-upload-form');
        if (!form || !window.XMLHttpRequest) {
            return;
        }

        const progressPanel = document.getElementById('upload-progress');
        const progressBar = document.getElementById('upload-bar');
        const statusLabel = document.getElementById('upload-status');
        const percentLabel = document.getElementById('upload-percent');
        const sizeLabel = document.getElementById('upload-size');
        const speedLabel = document.getElementById('upload-speed');
        const etaLabel = document.getElementById('upload-eta');
        const saveButton = document.getElementById('book-save-button');

        const fileInputs = Array.from(form.querySelectorAll('input[type="file"]'));

        const selectedFileBytes = () => fileInputs.reduce((total, input) => {
            return total + Array.from(input.files || []).reduce((sum, file) => sum + file.size, 0);
        }, 0);

        const formatBytes = (bytes) => {
            if (!bytes) {
                return '0 B';
            }
            const units = ['B', 'KB', 'MB', 'GB'];
            const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            const value = bytes / Math.pow(1024, index);
            return `${value.toFixed(value >= 10 || index === 0 ? 0 : 1)} ${units[index]}`;
        };

        const formatTime = (seconds) => {
            if (!Number.isFinite(seconds) || seconds < 0) {
                return 'calculating';
            }
            if (seconds < 1) {
                return 'less than 1s';
            }
            const rounded = Math.ceil(seconds);
            const minutes = Math.floor(rounded / 60);
            const remainder = rounded % 60;
            return minutes > 0 ? `${minutes}m ${remainder}s` : `${remainder}s`;
        };

        const updateProgress = (loaded, total, startedAt) => {
            const elapsedSeconds = Math.max((Date.now() - startedAt) / 1000, 0.1);
            const speed = loaded / elapsedSeconds;
            const percent = total > 0 ? Math.min((loaded / total) * 100, 100) : 0;
            const remainingSeconds = speed > 0 && total > 0 ? (total - loaded) / speed : Number.NaN;

            progressBar.style.width = `${percent.toFixed(1)}%`;
            percentLabel.textContent = `${Math.round(percent)}%`;
            sizeLabel.textContent = total > 0 ? `${formatBytes(loaded)} / ${formatBytes(total)}` : formatBytes(loaded);
            speedLabel.textContent = `${formatBytes(speed)}/s`;
            etaLabel.textContent = formatTime(remainingSeconds);
        };

        form.addEventListener('submit', (event) => {
            if (!selectedFileBytes()) {
                return;
            }
            if (!form.reportValidity()) {
                return;
            }

            event.preventDefault();

            const xhr = new XMLHttpRequest();
            const startedAt = Date.now();
            const fallbackTotal = selectedFileBytes();

            progressPanel.classList.remove('hidden');
            saveButton.disabled = true;
            statusLabel.textContent = 'Uploading files';
            updateProgress(0, fallbackTotal, startedAt);

            xhr.open(form.method.toUpperCase(), form.action);
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');

            xhr.upload.addEventListener('progress', (progressEvent) => {
                const total = progressEvent.lengthComputable ? progressEvent.total : fallbackTotal;
                updateProgress(progressEvent.loaded, total, startedAt);
            });

            xhr.upload.addEventListener('load', () => {
                updateProgress(fallbackTotal, fallbackTotal, startedAt);
                statusLabel.textContent = 'Processing upload';
                etaLabel.textContent = 'almost done';
            });

            xhr.addEventListener('load', () => {
                if (xhr.status === 422) {
                    document.open();
                    document.write(xhr.responseText);
                    document.close();
                    return;
                }
                if (xhr.status >= 200 && xhr.status < 400) {
                    window.location.href = xhr.responseURL || form.dataset.successUrl;
                    return;
                }
                statusLabel.textContent = 'Upload failed';
                saveButton.disabled = false;
            });

            xhr.addEventListener('error', () => {
                statusLabel.textContent = 'Network error during upload';
                saveButton.disabled = false;
            });

            xhr.addEventListener('abort', () => {
                statusLabel.textContent = 'Upload canceled';
                saveButton.disabled = false;
            });

            xhr.send(new FormData(form));
        });
    })();
</script>
</body>
</html>

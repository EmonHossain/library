<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Borrow Records')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="mx-auto max-w-6xl px-4 py-8">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="mt-6 text-3xl font-semibold tracking-tight">Borrow records</h1>
    <div class="mt-6 overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
        <table class="w-full text-left text-sm">
            <thead class="bg-slate-100 text-xs uppercase text-slate-600">
            <tr>
                <th class="px-4 py-3">User</th>
                <th class="px-4 py-3">Book</th>
                <th class="px-4 py-3">Borrowed</th>
                <th class="px-4 py-3">Due</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3"></th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
            <tr th:each="borrow : ${borrows}">
                <td class="px-4 py-3">
                    <div th:text="${borrow.user.fullName}" class="font-medium text-slate-950">User</div>
                    <div th:text="${borrow.user.email}" class="text-slate-500">Email</div>
                </td>
                <td class="px-4 py-3">
                    <div th:text="${borrow.book.title}" class="font-medium text-slate-950">Book</div>
                    <div th:text="${borrow.book.author}" class="text-slate-500">Author</div>
                </td>
                <td th:text="${#temporals.format(borrow.borrowedAt, 'MMM d, yyyy')}" class="px-4 py-3"></td>
                <td th:text="${#temporals.format(borrow.dueAt, 'MMM d, yyyy')}" class="px-4 py-3"></td>
                <td th:text="${borrow.status}" class="px-4 py-3"></td>
                <td class="px-4 py-3 text-right">
                    <form th:if="${borrow.status.name() == 'ACTIVE'}" th:action="@{/admin/borrows/{id}/return(id=${borrow.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="rounded-md border border-slate-300 px-3 py-2 font-medium text-slate-800 hover:bg-slate-50">Return</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${borrows.isEmpty()}" class="p-6 text-center text-slate-600">No borrow records yet.</p>
    </div>
</main>
</body>
</html>

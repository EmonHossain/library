<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title + ' | Library'}">Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<nav th:fragment="nav" class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
        <a th:href="@{/books}" class="text-lg font-semibold tracking-tight text-slate-950">Library</a>
        <div class="flex items-center gap-4 text-sm">
            <a th:href="@{/books}" class="text-slate-700 hover:text-slate-950">Books</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/my-borrows}" class="text-slate-700 hover:text-slate-950">My borrows</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="text-slate-700 hover:text-slate-950">Admin</a>
            <a sec:authorize="isAnonymous()" th:href="@{/login}" class="rounded-md bg-slate-950 px-3 py-2 font-medium text-white hover:bg-slate-800">Login</a>
            <a sec:authorize="isAnonymous()" th:href="@{/register}" class="rounded-md border border-slate-300 px-3 py-2 font-medium text-slate-800 hover:bg-slate-50">Register</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="rounded-md border border-slate-300 px-3 py-2 font-medium text-slate-800 hover:bg-slate-50">Logout</button>
            </form>
        </div>
    </div>
</nav>
<div th:fragment="alerts" class="space-y-3">
    <div th:if="${success}" th:text="${success}" class="rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800"></div>
    <div th:if="${error}" th:text="${error}" class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></div>
</div>
</body>
</html>

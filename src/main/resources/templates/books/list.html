<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Books')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="mx-auto max-w-6xl px-4 py-8">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="mt-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
        <div>
            <h1 class="text-3xl font-semibold tracking-tight">Book catalog</h1>
            <p class="mt-2 text-sm text-slate-600">Search by title, author, ISBN, or category.</p>
        </div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/books/new}" class="rounded-md bg-slate-950 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">Add book</a>
    </div>

    <form th:action="@{/books}" method="get" class="mt-6 grid gap-3 rounded-lg border border-slate-200 bg-white p-4 shadow-sm md:grid-cols-[1fr_220px_auto]">
        <input name="q" th:value="${q}" placeholder="Search books" class="rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
        <select name="categoryId" class="rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
            <option value="">All categories</option>
            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == categoryId}"></option>
        </select>
        <button type="submit" class="rounded-md bg-slate-950 px-4 py-2 font-medium text-white hover:bg-slate-800">Search</button>
    </form>

    <div class="mt-6 grid gap-4 md:grid-cols-2">
        <article th:each="book : ${books}" class="flex gap-4 rounded-lg border border-slate-200 bg-white p-4 shadow-sm">
            <img th:src="${book.coverImageFile != null} ? @{/files/{id}(id=${book.coverImageFile.id})} : @{/images/book-placeholder.svg}"
                 th:alt="${book.title + ' cover'}"
                 onerror="this.onerror=null;this.src='/images/book-placeholder.svg';"
                 class="h-32 w-24 flex-none rounded-md bg-slate-100 object-cover">
            <div class="min-w-0 flex-1">
                <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                    <div class="min-w-0">
                        <p th:text="${book.category.name}" class="text-xs font-semibold uppercase tracking-wide text-slate-500">Category</p>
                        <h2 th:text="${book.title}" class="mt-1 break-words text-lg font-semibold leading-snug">Title</h2>
                        <p th:text="${book.author}" class="mt-1 text-sm text-slate-600">Author</p>
                    </div>
                    <span th:text="${book.availableCopies + '/' + book.totalCopies + ' available'}" class="w-fit rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-700"></span>
                </div>
                <p th:text="${book.description}" class="mt-3 line-clamp-3 text-sm leading-6 text-slate-700">Description</p>
                <p class="mt-3 text-xs text-slate-500">ISBN <span th:text="${book.isbn}">isbn</span></p>
                <div class="mt-4 flex flex-wrap gap-3">
                    <a th:if="${book.pdfFile != null}" th:href="@{/files/{id}(id=${book.pdfFile.id})}" target="_blank" class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-800 hover:bg-slate-50">Open PDF</a>
                    <form sec:authorize="isAuthenticated()" th:action="@{/books/{id}/borrow(id=${book.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" th:disabled="${book.availableCopies == 0}" class="rounded-md bg-slate-950 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800 disabled:cursor-not-allowed disabled:bg-slate-300">Borrow</button>
                    </form>
                </div>
            </div>
        </article>
    </div>
    <p th:if="${books.isEmpty()}" class="mt-8 rounded-lg border border-slate-200 bg-white p-6 text-center text-slate-600">No books found.</p>
</main>
</body>
</html>

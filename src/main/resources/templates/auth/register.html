<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="mx-auto flex max-w-md flex-col px-4 py-12">
    <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-semibold tracking-tight">Create account</h1>
        <form th:action="@{/register}" th:object="${registrationRequest}" method="post" class="mt-6 space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Full name</span>
                <input th:field="*{fullName}" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
                <span th:errors="*{fullName}" class="mt-1 block text-sm text-red-700"></span>
            </label>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Email</span>
                <input th:field="*{email}" type="email" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
                <span th:errors="*{email}" class="mt-1 block text-sm text-red-700"></span>
            </label>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Password</span>
                <input th:field="*{password}" type="password" required minlength="8" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
                <span th:errors="*{password}" class="mt-1 block text-sm text-red-700"></span>
            </label>
            <button type="submit" class="w-full rounded-md bg-slate-950 px-4 py-2 font-medium text-white hover:bg-slate-800">Register</button>
        </form>
    </section>
</main>
</body>
</html>

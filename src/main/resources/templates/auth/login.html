<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="mx-auto flex max-w-md flex-col px-4 py-12">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="mt-6 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-2xl font-semibold tracking-tight">Login</h1>
        <p class="mt-2 text-sm text-slate-600">Demo admin: admin@library.test / admin123</p>
        <p class="text-sm text-slate-600">Demo user: user@library.test / user12345</p>
        <div th:if="${param.error}" class="mt-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">Invalid email or password.</div>
        <div th:if="${param.logout}" class="mt-4 rounded-md border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">You have been logged out.</div>
        <form th:action="@{/login}" method="post" class="mt-6 space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Email</span>
                <input name="email" type="email" required autofocus class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
            </label>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Password</span>
                <input name="password" type="password" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-900">
            </label>
            <button type="submit" class="w-full rounded-md bg-slate-950 px-4 py-2 font-medium text-white hover:bg-slate-800">Sign in</button>
        </form>
    </section>
</main>
</body>
</html>
